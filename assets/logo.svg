<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#00b4d8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7b68ee;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="mic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00b4d8;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="200" cy="185" r="120" fill="none" stroke="#00d4aa" stroke-width="2" stroke-opacity="0.15"/>
  <circle cx="200" cy="185" r="140" fill="none" stroke="#7b68ee" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Audio waveform bars -->
  <g filter="url(#glow)" transform="translate(200,185)">
    <rect x="-80" y="-18" width="6" height="36" rx="3" fill="url(#wave)" opacity="0.6"/>
    <rect x="-64" y="-32" width="6" height="64" rx="3" fill="url(#wave)" opacity="0.7"/>
    <rect x="-48" y="-22" width="6" height="44" rx="3" fill="url(#wave)" opacity="0.65"/>
    <rect x="-32" y="-45" width="6" height="90" rx="3" fill="url(#wave)" opacity="0.8"/>
    <rect x="-16" y="-28" width="6" height="56" rx="3" fill="url(#wave)" opacity="0.75"/>

    <!-- Center mic shape -->
    <rect x="-5" y="-55" width="10" height="70" rx="5" fill="url(#mic)"/>
    <path d="M-18,15 Q-18,38 0,38 Q18,38 18,15" fill="none" stroke="url(#mic)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="38" x2="0" y2="52" stroke="url(#mic)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-12" y1="52" x2="12" y2="52" stroke="url(#mic)" stroke-width="3.5" stroke-linecap="round"/>

    <rect x="10" y="-28" width="6" height="56" rx="3" fill="url(#wave)" opacity="0.75"/>
    <rect x="26" y="-45" width="6" height="90" rx="3" fill="url(#wave)" opacity="0.8"/>
    <rect x="42" y="-22" width="6" height="44" rx="3" fill="url(#wave)" opacity="0.65"/>
    <rect x="58" y="-32" width="6" height="64" rx="3" fill="url(#wave)" opacity="0.7"/>
    <rect x="74" y="-18" width="6" height="36" rx="3" fill="url(#wave)" opacity="0.6"/>
  </g>

  <!-- Text -->
  <text x="200" y="340" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#e0e0e0" letter-spacing="3">TRANSCRIBE</text>
  <text x="200" y="365" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#00d4aa" letter-spacing="5" opacity="0.8">v2.0</text>
</svg>
